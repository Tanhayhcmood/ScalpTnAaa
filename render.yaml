services:
  # Free-tier demo environment only. Free services can sleep, and this
  # Key Value instance does not persist data across restarts.
  - type: keyvalue
    name: ger-redis-fra
    plan: free
    region: frankfurt
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: off

  # MT5 REST bridge. Its UserKey is a fixed trial key from users.mtapi.io.
  - type: web
    name: goldscalper-v4-mtapi-fra
    region: frankfurt
    autoDeployTrigger: commit
    runtime: docker
    plan: free
    rootDir: mtapi-bridge
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /Ping
    envVars:
      - key: UserKey
        sync: false
      - key: MT5_HOST
        value: AMarkets-Demo
      - key: MT5_PORT
        value: "443"
      - key: MT5_USER
        fromService:
          type: web
          name: goldscalper-v4-robot-fra
          envVarKey: MT5_USER
      - key: MT5_PASSWORD
        fromService:
          type: web
          name: goldscalper-v4-robot-fra
          envVarKey: MT5_PASSWORD

  # ─── Trading robot ─────────────────────────────────────────────────────────
  - type: web
    name: goldscalper-v4-robot-fra
    region: frankfurt
    autoDeployTrigger: commit
    runtime: python
    plan: free
    healthCheckPath: /health
    buildCommand: pip install -r live_trading/requirements.txt
    startCommand: python live_trading/server.py
    envVars:
      # This endpoint is the Frankfurt MT5 bridge defined above.
      - key: MTAPI_URL
        value: "https://goldscalper-v4-mtapi-fra.onrender.com"
      - key: MT5_HOST
        value: "AMarkets-Demo"
      - key: MT5_PORT
        value: "443"
      - key: MT5_USER
        sync: false
      - key: MT5_PASSWORD
        sync: false
      # FIX: broker reports gold as "XAUUSD", not "XAUUSDb" — the wrong
      # symbol caused every candle/order request to fail silently, which was
      # the real reason the robot never opened a trade.
      - key: SYMBOL
        value: XAUUSD
      # FIX: TIMEFRAME and CANDLE_WINDOW are now env-configurable (fix #4).
      - key: TIMEFRAME
        value: "5m"
      - key: CANDLE_WINDOW
        value: "300"
      # Keep the protective SL on stable M15 volatility while entries run on
      # M5, avoiding a stop that is too tight for normal gold noise.
      - key: SL_ATR_TIMEFRAME
        value: "M15"
      - key: SL_ATR_PERIOD
        value: "14"
      # Signal freshness limits in signal-timeframe ATRs. Strong trends and
      # HIGH_VOLATILITY use the strong-trend allowance; unlisted regimes keep
      # the tight range limit.
      - key: ENTRY_SIGNAL_ATR_PERIOD
        value: "14"
      - key: STALENESS_LIMIT_STRONG_TREND
        value: "1.3"
      - key: STALENESS_LIMIT_WEAK_TREND
        value: "1.0"
      - key: STALENESS_LIMIT_RANGE
        value: "0.75"
      # Extra room required beyond the next equal high/low before a fixed-R
      # target is considered reachable.
      - key: TARGET_ROOM_BUFFER_ATR
        value: "0.15"
      # Option 2: keep the balanced 35% HTF confidence floor reproducible from the live Render environment.
      - key: OPTION_TWO_MIN_CONFIDENCE
        value: "25"
      # Option 4: old BOS/CHoCH events cannot authorize live entries.
      - key: STRUCTURE_MAX_AGE_BARS
        value: "24"
      - key: RISK_PERCENT
        value: "1.0"
      # The base policy floor is one; standalone checks still gate single-vote entries.
      - key: MIN_CONFIRMATIONS
        value: "1"
      - key: TREND_MIN_CONFIRMATIONS
        value: "1"
      # Keep stops at least 3x higher-timeframe ATR and widen LOW_VOLATILITY
      # setups by another 0.5x, with the capital manager capped at 3.5x.
      - key: SL_ATR_BASE_MULTIPLIER
        value: "3.0"
      - key: LOW_VOLATILITY_SL_ATR_ADD
        value: "0.5"
      # Only Trend and Price Action can authorize live entries. SMC and
      # Wyckoff remain available for diagnostics but cannot open trades.
      - key: ENABLED_STRATEGIES
        value: "trend,price_action"
      # Dedicated RANGE playbook. The standalone PA path may authorize
      # one PA vote, but all RANGE structural, confidence, R:R, and risk gates
      # remain active.
      - key: RANGE_TRADING_ENABLED
        value: "true"
      - key: RANGE_MIN_CONFIRMATIONS
        value: "1"
      - key: RANGE_MIN_RR
        value: "1.5"
      - key: RANGE_EDGE_ATR_DISTANCE
        value: "0.25"
      - key: RANGE_RISK_PERCENT
        value: "0.25"
      # RANGE protection: BUY entries must be at support and SELL entries must
      # be at resistance, with a fresh same-direction sweep, a closed-candle
      # reversal, and at least two aligned strategy confirmations.
      - key: RANGE_ENTRY_FILTERS_ENABLED
        value: "true"
      # A clear directional Price Action signal may authorize an entry by itself.
      - key: PRICE_ACTION_STANDALONE
        value: "true"
      - key: PA_STANDALONE_MIN_SCORE
        value: "0.16"
      # Trend-only entries require a strong, direction-aligned Trend score.
      - key: TREND_STANDALONE
        value: "true"
      - key: TREND_STANDALONE_MIN_SCORE
        value: "55"
      - key: PA_MAX_BREAKOUT_EXTENSION_ATR
        value: "0.75"
      - key: MAX_RANGE_TRADES_PER_SESSION
        value: "2"
      - key: MAX_OPEN_TRADES
        value: "5"
      # Directional scalping is one-way by default. Opposite positions are
      # blocked even when they would occupy different strategy slots.
      - key: ALLOW_HEDGED_POSITIONS
        value: "false"
      # Bounded scale-in is allowed for current XVTB-tagged positions up to
      # MAX_OPEN_TRADES. Legacy or untagged positions still fail closed.
      # Price Action may authorize the strategy vote alone. All independent
      # confidence, quality, regime, MTF, and risk gates stay active.
      - key: REQUIRE_PRICE_ACTION
        value: "false"
      - key: REQUIRE_SMC_PRICE_ACTION_WYCKOFF
        value: "false"
      # Keep regime confidence requirements independent from the lowered hard
      # floor; standalone paths still pass quality, R:R, and risk gates.
      - key: NORMAL_MIN_CONFIDENCE
        value: "40"
      - key: RANGE_MIN_CONFIDENCE
        value: "40"
      - key: CONF_HARD_MIN
        value: "30"
      - key: DAILY_LOSS_LIMIT_PCT
        value: "3.0"
      - key: MAX_DRAWDOWN_PCT
        value: "8.0"
      - key: SLIPPAGE_POINTS
        value: "30"
      # Trailing waits for 1R, moves to breakeven, then uses
      # highest/lowest-price-since-entry minus 2.5 ATR.
      - key: TRAIL_CHANDELIER_ATR_MULTIPLIER
        value: "2.5"
      # Weak RANGE entries require a stronger strategy consensus.
      - key: RANGE_WEAK_MIN_CONFIRMATIONS
        value: "2"
      # Use M5 as the sole live entry timeframe for scalping. The protective
      # SL remains based on M15 volatility above.
      - key: TRADE_TIMEFRAMES
        value: "5m"
      - key: QUALITY_ADX_MIN
        value: "12"
      - key: BAR_CHECK_INTERVAL
        value: "10"
      # Historical candle calls are bounded and retried locally. They must not
      # tear down a healthy MetaAPI session when the data endpoint has a brief
      # timeout around a bar close.
      - key: HISTORICAL_RPC_CONCURRENCY
        value: "2"
      - key: HISTORICAL_RETRY_ATTEMPTS
        value: "2"
      - key: HISTORICAL_RETRY_BACKOFF
        value: "1.0"
      # MTF is disabled so HTF alignment/opposition cannot block live entries.
      - key: MTF_ENABLED
        value: "false"
      - key: MTF_TIMEFRAME
        value: "H1"
      - key: MTF_CANDLE_WINDOW
        value: "300"
      - key: MTF_REQUIRE_ALIGNMENT
        value: "false"
      - key: MTF_DRY_RUN
        value: "true"
      - key: OPTION_TWO_MIN_TIMEFRAMES
        value: "2"
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: STATE_FILE
        value: "/tmp/robot_state.json"
      - key: MT5_SNAPSHOT
        value: "/tmp/robot_mt5_snapshot.json"
      - key: COMMANDS_FILE
        value: "/tmp/robot_commands.json"
      - key: GUARDIAN_STATE_FILE
        value: "/tmp/guardian_state.json"
      - key: LOG_FILE
        value: "/tmp/robot.log"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ger-redis-fra
          property: connectionString
      - key: ROBOT_COMMAND_TOKEN
        generateValue: true

  # ─── Telegram control panel ────────────────────────────────────────────────
  - type: web
    name: goldscalper-v4-panel-fra
    region: frankfurt
    autoDeployTrigger: commit
    runtime: python
    plan: free
    healthCheckPath: /health
    buildCommand: pip install -r telegram_panel/requirements.txt
    startCommand: python telegram_panel/server.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_OWNER_ID
        sync: false
      - key: PANEL_ENCRYPTION_KEY
        generateValue: true
      - key: MT5_HOST
        value: AMarkets-Demo
      - key: MT5_ACCOUNT_TYPE
        value: demo
      - key: MT5_USER
        fromService:
          type: web
          name: goldscalper-v4-robot-fra
          envVarKey: MT5_USER
      - key: MT5_PASSWORD
        fromService:
          type: web
          name: goldscalper-v4-robot-fra
          envVarKey: MT5_PASSWORD
      - key: TELEGRAM_ADMIN_IDS
        value: ""
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: PANEL_DB_PATH
        value: "/tmp/panel.db"
      - key: LOG_LEVEL
        value: "INFO"
      - key: ROBOT_INTERFACE_MODE
        value: "redis"
      - key: ROBOT_STATE_PATH
        value: "/tmp/robot_state.json"
      - key: ROBOT_BASE_URL
        value: "https://goldscalper-v4-robot-fra.onrender.com"
      - key: ROBOT_COMMAND_TOKEN
        fromService:
          type: web
          name: goldscalper-v4-robot-fra
          envVarKey: ROBOT_COMMAND_TOKEN
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ger-redis-fra
          property: connectionString