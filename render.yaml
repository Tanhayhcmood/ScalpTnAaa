services:
  # ─── Redis — cross-service IPC (robot ↔ Telegram panel) ───────────────────
  # Keep the shared Redis service in Singapore with the robot and panel.
  # It was previously created in frankfurt, so its private hostname never
  # resolved from oregon — the panel silently never saw live position/state
  # updates from the robot even though the robot itself was healthy.
  - type: redis
    name: ger-redis
    plan: free
    region: singapore
    ipAllowList: []   # private — Render internal routing only; no public access

  # ─── Trading robot ─────────────────────────────────────────────────────────
  - type: web
    name: goldscalper-v4-robot-sg
    region: singapore
    autoDeployTrigger: commit
    runtime: python
    plan: free
    healthCheckPath: /health
    buildCommand: pip install -r live_trading/requirements.txt
    startCommand: python live_trading/server.py
    envVars:
      # Render supplies RENDER_EXTERNAL_URL/RENDER_EXTERNAL_HOSTNAME for the
      # current service. Do not hard-code a generated hostname here: when the
      # service is renamed, a stale value makes the free-tier keepalive ping a
      # different service and the robot can be suspended for inactivity.
      - key: MTAPI_URL
        value: "https://mt5.mtapi.io"
      - key: MT5_HOST
        value: "AMarkets-Demo"
      - key: MT5_PORT
        value: "443"
      - key: MT5_USER
        sync: false
      - key: MT5_PASSWORD
        sync: false
      # FIX: broker reports gold as "XAUUSD", not "XAUUSDb" — the wrong
      # symbol caused every candle/order request to fail silently, which was
      # the real reason the robot never opened a trade.
      - key: SYMBOL
        value: XAUUSD
      # FIX: TIMEFRAME and CANDLE_WINDOW are now env-configurable (fix #4).
      - key: TIMEFRAME
        value: "1m"
      - key: CANDLE_WINDOW
        value: "300"
      # Option 2: keep the balanced 35% HTF confidence floor reproducible from the live Render environment.
      - key: OPTION_TWO_MIN_CONFIDENCE
        value: "25"
      # Option 4: old BOS/CHoCH events cannot authorize live entries.
      - key: STRUCTURE_MAX_AGE_BARS
        value: "24"
      - key: RISK_PERCENT
        value: "1.0"
      # Ordinary non-PA entries require two aligned engine confirmations.
      # Price Action has its own explicit standalone path below.
      - key: MIN_CONFIRMATIONS
        value: "2"
      - key: TREND_MIN_CONFIRMATIONS
        value: "2"
      # Dedicated RANGE playbook. The standalone PA path may authorize
      # one PA vote, but all RANGE structural, confidence, R:R, and risk gates
      # remain active.
      - key: RANGE_TRADING_ENABLED
        value: "true"
      - key: RANGE_MIN_CONFIRMATIONS
        value: "2"
      - key: RANGE_MIN_RR
        value: "1.5"
      - key: RANGE_EDGE_ATR_DISTANCE
        value: "0.25"
      - key: RANGE_RISK_PERCENT
        value: "0.25"
      # RANGE protection: BUY entries must be at support and SELL entries must
      # be at resistance, with a fresh same-direction sweep, a closed-candle
      # reversal, and at least two aligned strategy confirmations.
      - key: RANGE_ENTRY_FILTERS_ENABLED
        value: "true"
      # A directional Price Action signal may authorize an entry by itself.
      - key: PRICE_ACTION_STANDALONE
        value: "true"
      - key: PA_STANDALONE_MIN_SCORE
        value: "0.30"
      - key: MAX_RANGE_TRADES_PER_SESSION
        value: "2"
      - key: MAX_OPEN_TRADES
        value: "4"
      # Directional scalping is one-way by default. Opposite positions are
      # blocked even when they would occupy different strategy slots.
      - key: ALLOW_HEDGED_POSITIONS
        value: "false"
      # One concurrent position per strategy slot: SMC, Trend, Price Action,
      # and Wyckoff. Legacy untagged positions fail closed and occupy all slots.
      # Price Action may authorize the strategy vote alone. All independent
      # confidence, quality, regime, MTF, and risk gates stay active.
      - key: REQUIRE_PRICE_ACTION
        value: "false"
      - key: REQUIRE_SMC_PRICE_ACTION_WYCKOFF
        value: "false"
      # Keep the hard floor at the balanced default. Standalone PA increases
      # eligible setups without buying more trades by weakening quality.
      - key: NORMAL_MIN_CONFIDENCE
        value: "40"
      - key: RANGE_MIN_CONFIDENCE
        value: "40"
      - key: CONF_HARD_MIN
        value: "40"
      - key: DAILY_LOSS_LIMIT_PCT
        value: "3.0"
      - key: MAX_DRAWDOWN_PCT
        value: "8.0"
      - key: SLIPPAGE_POINTS
        value: "30"
      # TRADE_TIMEFRAMES / QUALITY_ADX_MIN are read by the live engine and
      # were set on the live service but missing from this manifest.
      - key: TRADE_TIMEFRAMES
        value: "M20,M15,M10,M5,1m"
      - key: QUALITY_ADX_MIN
        value: "12"
      - key: BAR_CHECK_INTERVAL
        value: "10"
      # Historical candle calls are bounded and retried locally. They must not
      # tear down a healthy MetaAPI session when the data endpoint has a brief
      # timeout around a bar close.
      - key: HISTORICAL_RPC_CONCURRENCY
        value: "2"
      - key: HISTORICAL_RETRY_ATTEMPTS
        value: "2"
      - key: HISTORICAL_RETRY_BACKOFF
        value: "1.0"
      # HTF opposition is a negative-only safety filter. It does not require
      # another strategy to agree, but blocks clearly opposed H1 conditions.
      - key: MTF_ENABLED
        value: "true"
      - key: MTF_TIMEFRAME
        value: "H1"
      - key: MTF_CANDLE_WINDOW
        value: "300"
      - key: MTF_DRY_RUN
        value: "false"
      - key: OPTION_TWO_MIN_TIMEFRAMES
        value: "2"
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: STATE_FILE
        value: "/tmp/robot_state.json"
      - key: MT5_SNAPSHOT
        value: "/tmp/robot_mt5_snapshot.json"
      - key: COMMANDS_FILE
        value: "/tmp/robot_commands.json"
      - key: GUARDIAN_STATE_FILE
        value: "/tmp/guardian_state.json"
      - key: LOG_FILE
        value: "/tmp/robot.log"
      - key: REDIS_URL
        fromService:
          type: redis
          name: ger-redis
          property: connectionString
      # FIX #1: ROBOT_COMMAND_TOKEN enables HTTP command fallback from panel.
      - key: ROBOT_COMMAND_TOKEN
        sync: false

  # ─── Telegram control panel ────────────────────────────────────────────────
  - type: web
    name: goldscalper-v4-panel-sg
    region: singapore
    autoDeployTrigger: commit
    runtime: python
    plan: free
    healthCheckPath: /health
    buildCommand: pip install -r telegram_panel/requirements.txt
    startCommand: python telegram_panel/server.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_OWNER_ID
        sync: false
      - key: PANEL_ENCRYPTION_KEY
        sync: false
      - key: TELEGRAM_ADMIN_IDS
        value: ""
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: PANEL_DB_PATH
        value: "/tmp/panel.db"
      - key: LOG_LEVEL
        value: "INFO"
      - key: ROBOT_INTERFACE_MODE
        value: "redis"
      - key: ROBOT_STATE_PATH
        value: "/tmp/robot_state.json"
      # FIX #1: ROBOT_BASE_URL and ROBOT_COMMAND_TOKEN enable HTTP fallback.
      - key: ROBOT_BASE_URL
        value: "https://goldscalper-v4-robot-sg.onrender.com"
      - key: ROBOT_COMMAND_TOKEN
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: ger-redis
          property: connectionString