services:
  # ─── Redis — cross-service IPC (robot ↔ Telegram panel) ───────────────────
  # Keep the shared Redis service in Singapore with the robot and panel.
  # It was previously created in frankfurt, so its private hostname never
  # resolved from oregon — the panel silently never saw live position/state
  # updates from the robot even though the robot itself was healthy.
  - type: redis
    name: ger-redis
    plan: free
    region: singapore
    ipAllowList: []   # private — Render internal routing only; no public access

  # ─── Trading robot ────────────────────────────────────────────────────────
  - type: web
    name: goldscalper-v4-robot-sg
    region: singapore
    autoDeployTrigger: commit
    runtime: python
    plan: free
    healthCheckPath: /health
    buildCommand: pip install -r live_trading/requirements.txt
    startCommand: python live_trading/server.py
    envVars:
      - key: MTAPI_URL
        value: "https://mt5.mtapi.io"
      - key: MT5_HOST
        value: "AMarkets-Demo"
      - key: MT5_PORT
        value: "443"
      - key: MT5_USER
        sync: false
      - key: MT5_PASSWORD
        sync: false
      - key: SYMBOL
        value: XAUUSD
      # M1 is the entry/execution timeframe. Protective stop ATR remains on M15
      # so one-minute noise does not make the initial stop artificially tight.
      - key: TIMEFRAME
        value: "1m"
      - key: TRADE_TIMEFRAMES
        value: "1m"
      - key: CANDLE_WINDOW
        value: "300"
      - key: SL_ATR_TIMEFRAME
        value: "M15"
      - key: SL_ATR_PERIOD
        value: "14"
      - key: ENTRY_SIGNAL_ATR_PERIOD
        value: "14"
      - key: STALENESS_LIMIT_STRONG_TREND
        value: "1.3"
      - key: STALENESS_LIMIT_WEAK_TREND
        value: "1.0"
      - key: STALENESS_LIMIT_RANGE
        value: "0.75"
      - key: TARGET_ROOM_BUFFER_ATR
        value: "0.15"
      - key: OPTION_TWO_MIN_CONFIDENCE
        value: "25"
      - key: STRUCTURE_MAX_AGE_BARS
        value: "24"
      - key: RISK_PERCENT
        value: "1.0"
      - key: MAX_TOTAL_RISK_PERCENT
        value: "2.0"
      - key: MIN_CONFIRMATIONS
        value: "1"
      - key: TREND_MIN_CONFIRMATIONS
        value: "1"
      - key: SL_ATR_BASE_MULTIPLIER
        value: "2.0"
      - key: LOW_VOLATILITY_SL_ATR_ADD
        value: "0.5"
      - key: TP_RR
        value: "1.5"
      - key: TP_MAX_ATR
        value: "4.0"
      - key: ENABLED_STRATEGIES
        value: "trend,price_action"
      - key: RANGE_TRADING_ENABLED
        value: "true"
      - key: RANGE_MIN_CONFIRMATIONS
        value: "1"
      - key: RANGE_MIN_RR
        value: "1.5"
      - key: RANGE_EDGE_ATR_DISTANCE
        value: "0.25"
      - key: RANGE_RISK_PERCENT
        value: "0.25"
      - key: RANGE_ENTRY_FILTERS_ENABLED
        value: "true"
      - key: PRICE_ACTION_STANDALONE
        value: "true"
      - key: PA_STANDALONE_MIN_SCORE
        value: "0.16"
      - key: TREND_STANDALONE
        value: "true"
      - key: TREND_STANDALONE_MIN_SCORE
        value: "55"
      - key: PA_MAX_BREAKOUT_EXTENSION_ATR
        value: "0.75"
      - key: MAX_RANGE_TRADES_PER_SESSION
        value: "2"
      - key: MAX_OPEN_TRADES
        value: "2"
      - key: TIME_STOP_BARS
        value: "12"
      - key: TIME_STOP_MIN_R
        value: "0.5"
      - key: MAX_TRADE_MINUTES
        value: "240"
      - key: ALLOW_HEDGED_POSITIONS
        value: "false"
      - key: REQUIRE_PRICE_ACTION
        value: "false"
      - key: REQUIRE_SMC_PRICE_ACTION_WYCKOFF
        value: "false"
      - key: NORMAL_MIN_CONFIDENCE
        value: "40"
      - key: RANGE_MIN_CONFIDENCE
        value: "40"
      - key: CONF_HARD_MIN
        value: "30"
      - key: DAILY_LOSS_LIMIT_PCT
        value: "3.0"
      - key: MAX_DRAWDOWN_PCT
        value: "8.0"
      - key: SLIPPAGE_POINTS
        value: "30"
      - key: TRAIL_CHANDELIER_ATR_MULTIPLIER
        value: "1.5"
      - key: RANGE_WEAK_MIN_CONFIRMATIONS
        value: "2"
      - key: QUALITY_ADX_MIN
        value: "12"
      - key: BAR_CHECK_INTERVAL
        value: "5"
      - key: HISTORICAL_RPC_CONCURRENCY
        value: "2"
      - key: HISTORICAL_RETRY_ATTEMPTS
        value: "2"
      - key: HISTORICAL_RETRY_BACKOFF
        value: "1.0"
      - key: MTF_ENABLED
        value: "false"
      - key: MTF_TIMEFRAME
        value: "H1"
      - key: MTF_CANDLE_WINDOW
        value: "300"
      - key: MTF_REQUIRE_ALIGNMENT
        value: "false"
      - key: MTF_DRY_RUN
        value: "true"
      - key: OPTION_TWO_MIN_TIMEFRAMES
        value: "2"
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: STATE_FILE
        value: "/tmp/robot_state.json"
      - key: MT5_SNAPSHOT
        value: "/tmp/robot_mt5_snapshot.json"
      - key: COMMANDS_FILE
        value: "/tmp/robot_commands.json"
      - key: GUARDIAN_STATE_FILE
        value: "/tmp/guardian_state.json"
      - key: LOG_FILE
        value: "/tmp/robot.log"
      - key: REDIS_URL
        fromService:
          type: redis
          name: ger-redis
          property: connectionString
      - key: ROBOT_COMMAND_TOKEN
        sync: false

  # ─── Telegram control panel ────────────────────────────────────────────────
  - type: web
    name: goldscalper-v4-panel-sg
    region: singapore
    autoDeployTrigger: commit
    runtime: python
    plan: free
    healthCheckPath: /health
    buildCommand: pip install -r telegram_panel/requirements.txt
    startCommand: python telegram_panel/server.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_OWNER_ID
        sync: false
      - key: PANEL_ENCRYPTION_KEY
        sync: false
      - key: TELEGRAM_ADMIN_IDS
        value: ""
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: PANEL_DB_PATH
        value: "/tmp/panel.db"
      - key: LOG_LEVEL
        value: "INFO"
      - key: ROBOT_INTERFACE_MODE
        value: "redis"
      - key: ROBOT_STATE_PATH
        value: "/tmp/robot_state.json"
      - key: ROBOT_BASE_URL
        value: "https://goldscalper-v4-robot-sg.onrender.com"
      - key: ROBOT_COMMAND_TOKEN
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: ger-redis
          property: connectionString
